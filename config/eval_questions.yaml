# Hand-curated eval questions, stratified by the reasoning they require.
#
# single_hop  — answerable from one message/chunk. Both plain vector RAG and
#               graph-augmented RAG should do about equally well here; this
#               stratum is the control group, not where a win is expected.
# two_hop     — requires connecting two people/entities who are not both named
#               in any single chunk. Plain vector RAG should struggle; this is
#               where graph traversal is expected to help once it exists.
# community   — requires whole-graph structure (clusters, centrality) that no
#               bounded traversal from a single seed node could produce.
#
# expected_chunk_ids is only filled in where the answer is machine-checkable
# today (single_hop, mostly). two_hop/community entries are placeholders for
# once the knowledge graph exists — graded by manual read for now, not by
# retrieval_metrics.py.

