  question: "What distinct groups of contacts appear in Epstein's correspondence (e.g. legal, philanthropy, media)?"
  expected_chunk_ids: []
  notes: "Requires clustering over the whole edge set, not a bounded traversal. Not answerable at all pre-graph."

- id: q202
