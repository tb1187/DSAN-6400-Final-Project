- id: q101
  category: two_hop
  question: "How were Boris Nikolic and Prince Andrew connected, according to this corpus?"
  expected_chunk_ids: []
  notes: >
    Not a single-chunk fact — Nikolic mentions meeting Prince Andrew in an
    email to Epstein; the connection is Nikolic -> Epstein -> Andrew, not a
    direct Nikolic/Andrew edge. Good test of whether plain vector RAG
    conflates "both mentioned nearby" with an actual traced relationship.
    Grade by manual read until graph RAG exists.

